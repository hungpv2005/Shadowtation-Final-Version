# Hạ tầng dev: PostgreSQL 15 + Redis 7 (cấu hình nhẹ cho máy yếu).
# Chạy:    docker compose up -d
# Dừng:    docker compose stop      (giữ dữ liệu)
# Xóa hẳn: docker compose down -v   (xóa cả dữ liệu)
services:
  postgres:
    image: postgres:15-alpine
    container_name: shadowtation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shadowtation
    ports:
      - "5432:5432"
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=192MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shadowtation"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shadowtation-redis
    restart: unless-stopped
    # BullMQ yêu cầu maxmemory-policy = noeviction
    command: redis-server --maxmemory 64mb --maxmemory-policy noeviction --save "" --appendonly no
    ports:
      - "6379:6379"
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Tùy chọn (dùng từ GĐ4 nếu chưa có AWS S3): docker compose --profile storage up -d
  minio:
    image: minio/minio:latest
    container_name: shadowtation-minio
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    mem_limit: 256m

volumes:
  pgdata:
  miniodata:
